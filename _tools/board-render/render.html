<!DOCTYPE html>
<!--
    Floating board render for the case study showcases.

    Builds a thin 3D panel (three.js 0.160 from ../laptop-render/vendor/) with
    an artwork printed on its face, turned slightly in space, and renders it
    to a transparent, trimmed WebP. Not part of the site: GitHub Pages skips
    folders that start with "_".

    Preview (served over http, e.g. a local server at the repo root):
        /_tools/board-render/render.html?preview
    Export (headless Chrome prints the image as a data URL in <pre id="out">):
        Chrome --headless=new --dump-dom --virtual-time-budget=20000 \
            "http://localhost:8123/_tools/board-render/render.html"
        then decode the data URL into Case-Study/<name>-board.webp (and copy to en/Case-Study/).
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Board render</title>
    <style>
        html, body { margin: 0; background: #e6eef2; }
        canvas { display: block; max-width: 100vw; height: auto; }
        #out { display: none; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "../laptop-render/vendor/three.module.js",
                "three/addons/": "../laptop-render/vendor/"
            }
        }
    </script>
</head>
<body>
    <pre id="out"></pre>
    <script type="module">
        import * as THREE from 'three';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const params = new URLSearchParams(location.search);
        const artSrc = params.get('art') || '../../Case-Study/wall-art-mural.jpg';
        const preview = params.has('preview');
        const W = Number(params.get('w') || 3000);
        const H = Number(params.get('h') || 1500);

        // --- Renderer, scene, lighting ------------------------------------------------
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(1);
        renderer.setSize(W, H);
        renderer.setClearColor(0x000000, 0);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = Number(params.get('exposure') || 1.0);
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

        const key = new THREE.DirectionalLight(0xffffff, 1.6);
        key.position.set(-120, 160, 260);
        scene.add(key);
        const rim = new THREE.DirectionalLight(0xcfe6f2, 2.0); // icy blue rim, matches the showcase
        rim.position.set(220, 60, -120);
        scene.add(rim);
        scene.add(new THREE.AmbientLight(0xffffff, 0.25));

        // --- Board: an aluminium-composite panel with the artwork printed on its face -----
        const art = await new THREE.TextureLoader().loadAsync(artSrc);
        art.colorSpace = THREE.SRGBColorSpace;
        art.anisotropy = 16;

        const BW = 300, BH = BW * art.image.height / art.image.width, BD = 3.2;
        const board = new THREE.Group();
        scene.add(board);

        const edge = new THREE.MeshPhysicalMaterial({
            color: 0xf4f6f8, roughness: 0.35, metalness: 0.4, clearcoat: 0.6, clearcoatRoughness: 0.2, envMapIntensity: 1.2
        });
        board.add(new THREE.Mesh(new RoundedBoxGeometry(BW, BH, BD, 6, 0.9), edge));

        // Printed face: satin vinyl, a hair in from the edge (not tone mapped, which
        // washes the colours out)
        const face = new THREE.Mesh(new THREE.PlaneGeometry(BW - 1.2, BH - 1.2), new THREE.MeshPhysicalMaterial({
            map: art, roughness: 0.42, metalness: 0, clearcoat: 0.35, clearcoatRoughness: 0.25, envMapIntensity: 0.55,
            toneMapped: false // keep the artwork's own colours
        }));
        face.position.z = BD / 2 + 0.02;
        board.add(face);

        // Soft diagonal sheen across the face
        const gc = document.createElement('canvas');
        gc.width = 1600; gc.height = 500;
        const gg = gc.getContext('2d');
        const grad = gg.createLinearGradient(0, 0, gc.width, gc.height);
        grad.addColorStop(0.0, 'rgba(255,255,255,0.0)');
        grad.addColorStop(0.42, 'rgba(255,255,255,0.0)');
        grad.addColorStop(0.5, 'rgba(255,255,255,0.10)');
        grad.addColorStop(0.62, 'rgba(255,255,255,0.0)');
        grad.addColorStop(1.0, 'rgba(255,255,255,0.0)');
        gg.fillStyle = grad;
        gg.fillRect(0, 0, gc.width, gc.height);
        const sheen = new THREE.Mesh(new THREE.PlaneGeometry(BW - 1.2, BH - 1.2), new THREE.MeshBasicMaterial({
            map: new THREE.CanvasTexture(gc), transparent: true, depthWrite: false, toneMapped: false
        }));
        sheen.position.z = BD / 2 + 0.05;
        board.add(sheen);

        // --- Pose & camera ----------------------------------------------------------------
        board.rotation.y = Number(params.get('ry') || -0.3);   // right end recedes
        board.rotation.x = Number(params.get('rx') || 0.1);    // top tipped back a little
        board.rotation.z = Number(params.get('rz') || 0.025);  // a slight lift to the right, as if floating

        const camera = new THREE.PerspectiveCamera(22, W / H, 1, 2000);
        camera.position.set(0, 20, 620);
        camera.lookAt(0, 0, 0);

        renderer.render(scene, camera);

        // --- Export: trim transparent margins, output WebP --------------------------------
        const src = renderer.domElement;
        const probe = document.createElement('canvas');
        probe.width = W; probe.height = H;
        const pg = probe.getContext('2d');
        pg.drawImage(src, 0, 0);
        const data = pg.getImageData(0, 0, W, H).data;
        let minX = W, minY = H, maxX = 0, maxY = 0;
        for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
                if (data[(y * W + x) * 4 + 3] > 8) {
                    if (x < minX) minX = x; if (x > maxX) maxX = x;
                    if (y < minY) minY = y; if (y > maxY) maxY = y;
                }
            }
        }
        const pad = 6;
        minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
        maxX = Math.min(W - 1, maxX + pad); maxY = Math.min(H - 1, maxY + pad);
        const out = document.createElement('canvas');
        out.width = maxX - minX + 1; out.height = maxY - minY + 1;
        out.getContext('2d').drawImage(src, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
        document.getElementById('out').textContent = out.toDataURL('image/webp', 0.9);
        if (preview) {
            out.style.cssText = 'display:block;max-width:100vw;max-height:100vh;margin:auto';
            document.body.appendChild(out);
        }
        document.title = `done ${out.width}x${out.height}`;
    </script>
</body>
</html>
