        .contact-form-section {
            padding: var(--spacing-2xl) 0;
            background-color: var(--bg-primary);
        }

        .contact-form-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 var(--spacing-lg);
        }

        .contact-form {
            background-color: #f8fafc;
            padding: var(--spacing-xl);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: var(--spacing-lg);
        }

        .form-group label {
            display: block;
            margin-bottom: var(--spacing-xs);
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(13, 83, 145, 0.2);
        }

        textarea.form-control {
            min-height: 150px;
            resize: vertical;
        }

        .form-actions {
            text-align: center;
            margin-top: var(--spacing-xl);
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        .form-message {
            margin-top: var(--spacing-md);
            padding: var(--spacing-md);
            border-radius: var(--radius-sm);
            display: none;
        }

        .form-message.success {
            background-color: #e6f7ee;
            color: #0a6e3a;
            border: 1px solid #b8e6d0;
        }

        .form-message.error {
            background-color: #fde8e8;
            color: #c53030;
            border: 1px solid #f8c6c6;
        }

        @media (max-width: 768px) {
            .contact-form {
                padding: var(--spacing-lg);
            }
        }

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('contact-form');
            const formMessage = document.getElementById('form-message');
            
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const formData = new FormData(form);
                const submitBtn = form.querySelector('button[type="submit"]');
                const originalBtnText = submitBtn.textContent;
                
                try {
                    // Show loading state
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Sending...';
                    
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (response.ok) {
                        showMessage('Your message has been sent successfully! We\'ll get back to you soon.', 'success');
                        form.reset();
                    } else {
                        throw new Error('Form submission failed');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showMessage('There was a problem sending your message. Please try again later or contact us directly at miiumiiudesign@gmail.com', 'error');
                } finally {
                    // Reset button state
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalBtnText;
                }
            });
            
            function showMessage(message, type) {
                formMessage.textContent = message;
                formMessage.className = 'form-message ' + type;
                formMessage.style.display = 'block';
                
                // Scroll to the message
                formMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
                
                // Hide message after 10 seconds
                setTimeout(() => {
                    formMessage.style.display = 'none';
                }, 10000);
            }
        });
    </script>
